<section class="container mt-5">
  <h2 class="section-title">Shop Shoes</h2>
  <div class="row g-3 mb-3">
    <div class="col-md-5"><label for="productSearch" class="form-label">Search shoes</label><input id="productSearch" aria-label="Search shoes" class="form-control" placeholder="Search shoes..."></div>
    <div class="col-md-4"><label for="categoryFilter" class="form-label">Category</label><select id="categoryFilter" aria-label="Category" class="form-select"><option value="All">All categories</option><option>Sneakers</option><option>Running</option><option>Formal</option><option>Sandals</option></select></div>

  </div>

</section>
